# Builds WinSend on Windows.
#
# This exists because the GPUI front end cannot be cross-compiled from macOS in
# release mode, which is how every release before it was cut. gpui_windows's
# build script gates its HLSL shader compilation on `cfg(target_os = "windows")`
# — the host, for a build script — so on macOS the shaders are never generated
# while the renderer includes them unconditionally in release. Debug escapes it
# by compiling shaders at runtime; release cannot. Building on Windows is the
# fix, and it also gives the project its first check that it compiles there at
# all rather than only that it cross-compiles.
name: Windows release

on:
  # A tag cuts a pre-release with the binaries attached.
  push:
    tags: ["v*"]
  # And it can be run by hand against any branch, to get something to click on
  # without spending a tag on it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version gpui's edition 2024 tree needs, so
      # nothing here names it twice.
      - name: Show toolchain
        run: rustup show

      # gpui arrives as a git dependency on the whole zed tree, so an uncached
      # build is long and a cached one is not. The key covers the lockfile and
      # the pinned toolchain, which are the two things that invalidate it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: windows-cargo-

      - name: Test
        run: cargo test --locked

      # Default features build both front ends, so the eframe binary is checked
      # on Windows by the same run.
      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: winsend-windows
          path: |
            target/release/winsend.exe
            target/release/winsend-gpui.exe
          if-no-files-found: error

      # Pre-release, never latest. src/update.rs filters out drafts and
      # pre-releases, so nothing published here is offered to anyone already
      # running a shipped version.
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --prerelease `
            --title "${{ github.ref_name }}" `
            --notes "Built on windows-latest. winsend.exe is the eframe surface; winsend-gpui.exe is the GPUI one." `
            target/release/winsend.exe `
            target/release/winsend-gpui.exe
